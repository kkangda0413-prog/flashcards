<!--
  CHANGELOG — 되돌리려면: 이 폴더에서 `git log --oneline` 으로 버전 확인 후
  `git checkout <커밋해시> -- 암기카드.html` 실행 (그 다음 새로 저장하면 됨)
  v1.0 (2026-07-25) — 최초 버전: 카드/카테고리 CRUD, 계층 카테고리, 학습·자가채점(X/△/○), 필터, 전체 현황 대시보드
  v1.1 (2026-07-26) — 마인드맵 보기 추가, 학습 시 복수 카테고리 선택 + 셔플(랜덤 순서) 기능 추가, 버전 표시 시작
  v1.2 (2026-07-26) — 마인드맵을 SVG 다이어그램에서 들여쓰기 기반 목록(전체 제목 표시)으로 변경, PDF 다운로드 버튼 추가
  v1.3 (2026-07-26) — Firebase Google 로그인 + Firestore 클라우드 동기화, 로그인 게이트 추가 (기기 간 이어서 사용).
    firebaseConfig를 채우기 전까지는 게이트 없이 이 기기에만 저장되는 기존 방식 그대로 동작함.
  v1.3.1 (2026-07-26) — 실제 Firebase 프로젝트(flashcards-1c668) 설정값 반영, 로그인 게이트 활성화
  v1.4.0 (2026-07-26) — 카드 정렬 순서(order) 도입: 학습 순서가 마인드맵 순서와 항상 동일하게 맞춰지고,
    마인드맵에서 카드 옆 ▲▼ 버튼으로 순서를 직접 바꿀 수 있음
  v1.5.0 (2026-07-26) — 카테고리도 알파벳순이 아닌 입력한 순서대로 정렬되도록 수정.
    마인드맵의 ▲▼ 버튼을 드래그 핸들(⠿)로 교체하여 카드/카테고리를 원하는 위치로 직접 드래그해서 옮길 수 있음
  v1.6.0 (2026-07-26) — 모범답안에 볼드체 강조 추가. **텍스트** 로 감싸면 굵게 표시되고,
    답안 입력칸 위 B 버튼으로 선택한 텍스트를 한 번에 감쌀 수 있음
  v1.6.1 (2026-07-26) — 답안 입력칸에서 Ctrl+B(Mac: Cmd+B) 단축키로도 볼드체 적용 가능
  v1.7.0 (2026-07-26) — 답안 입력칸을 contenteditable 기반으로 변경해 **기호 없이 입력 즉시
    실제 굵은 글씨로 보이는 위지윅(WYSIWYG) 볼드 편집으로 전환. 저장 형식은 기존과 동일(마크다운 **문자열).
  v1.8.0 (2026-07-26) — 카드 중요도(★1~5) 추가: 카드 관리에서 별점 설정,
    마인드맵 카드 이름 옆에 별점 표시, 학습 범위 패널에서 중요도별로 필터링해 학습 가능
  v1.9.0 (2026-07-26) — 학습 화면 "내 답" 인출 칸에 제출하기 버튼 추가.
    제출한 답변은 날짜/시간과 함께 카드별 이력으로 저장되어 나중에 열람·삭제 가능
  v1.10.0 (2026-07-26) — 답변을 이미지로도 제출 가능. 📷 이미지 첨부로 사진을 붙이면
    자동 축소 후 미리보기가 뜨고, 제출하기를 누르면 텍스트와 함께(또는 이미지만) 이력에 저장됨.
    이력 목록에서 이미지 썸네일을 눌러 원본 크기로 볼 수 있음
  v1.10.1 (2026-07-26) — 답변 이미지를 Firebase Storage에 업로드하고 Firestore에는 URL만
    저장하도록 변경 (Firestore 문서당 1MB 제한 회피, 훨씬 많은 사진을 클라우드 동기화 가능).
    로그인하지 않았거나 Storage 미설정 시에는 기존처럼 이 기기에만 저장됨
  v1.10.2 (2026-07-26) — Firebase Storage(유료 Blaze 필요)를 Cloudinary 무료 플랜(카드 등록 불필요)으로
    교체. 답변 이미지는 이제 Cloudinary에 업로드되고 Firestore에는 URL만 저장됨
  v1.10.3 (2026-07-26) — 실제 Cloudinary 계정(cloud name: l7rv6jby) 설정값 반영
  v1.11.0 (2026-07-26) — 과목별 "보드" 여러 개 추가 기능. 상단에 보드 탭이 생겨 보드를
    추가/이름변경/삭제하고 전환할 수 있음. 보드마다 카테고리·카드·학습이력이 완전히 분리됨.
    기존 단일 보드 데이터는 "내 보드"로 자동 이전됨(데이터 손실 없음)
  v1.11.1 (2026-07-26) — [긴급 수정] 로그인 시 클라우드(Firestore)의 예전 형식 데이터를
    빈 보드로 잘못 읽어들이던 버그 수정. 로컬 로드와 클라우드 동기화가 동일한
    normalizeBoardsInput()을 공유하도록 통합하여 재발 방지
-->
<title>암기카드 — 셀프 인출 연습</title>
<style>
  :root {
    --paper: #EEF2ED;
    --paper-line: rgba(38,65,54,0.09);
    --paper-line-strong: rgba(38,65,54,0.16);
    --surface: #FFFFFF;
    --surface-2: #F5F8F4;
    --ink: #172019;
    --ink-soft: #55655C;
    --ink-faint: #8A9990;
    --accent: #26415C;
    --accent-soft: #DCE6EF;
    --red: #A6392E;
    --red-soft: #F6E3E0;
    --green: #2F6B4E;
    --green-soft: #DDEEE3;
    --amber: #96650E;
    --amber-soft: #F3E6CD;
    --border: rgba(23,32,25,0.14);
    --shadow: rgba(23,32,25,0.12);
    --font-serif: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    --font-sans: "Pretendard", "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "D2Coding", "Consolas", "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #11170F; --paper-line: rgba(255,255,255,0.055); --paper-line-strong: rgba(255,255,255,0.09);
      --surface: #182019; --surface-2: #1D2620; --ink: #E7EEE7; --ink-soft: #A9B7AC; --ink-faint: #6E7C71;
      --accent: #8FB3D9; --accent-soft: #22354A; --red: #E38176; --red-soft: #402420;
      --green: #7FC49E; --green-soft: #1E3327; --amber: #E3B563; --amber-soft: #3A2E16;
      --border: rgba(255,255,255,0.13); --shadow: rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #11170F; --paper-line: rgba(255,255,255,0.055); --paper-line-strong: rgba(255,255,255,0.09);
    --surface: #182019; --surface-2: #1D2620; --ink: #E7EEE7; --ink-soft: #A9B7AC; --ink-faint: #6E7C71;
    --accent: #8FB3D9; --accent-soft: #22354A; --red: #E38176; --red-soft: #402420;
    --green: #7FC49E; --green-soft: #1E3327; --amber: #E3B563; --amber-soft: #3A2E16;
    --border: rgba(255,255,255,0.13); --shadow: rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --paper: #EEF2ED; --paper-line: rgba(38,65,54,0.09); --paper-line-strong: rgba(38,65,54,0.16);
    --surface: #FFFFFF; --surface-2: #F5F8F4; --ink: #172019; --ink-soft: #55655C; --ink-faint: #8A9990;
    --accent: #26415C; --accent-soft: #DCE6EF; --red: #A6392E; --red-soft: #F6E3E0;
    --green: #2F6B4E; --green-soft: #DDEEE3; --amber: #96650E; --amber-soft: #F3E6CD;
    --border: rgba(23,32,25,0.14); --shadow: rgba(23,32,25,0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 23px, var(--paper-line) 23px, var(--paper-line) 24px),
      repeating-linear-gradient(90deg, transparent, transparent 23px, var(--paper-line) 23px, var(--paper-line) 24px),
      var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-family: var(--font-serif); font-weight: 700; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  .topbar .sub { font-size: 0.82rem; color: var(--ink-soft); margin-top: 4px; }
  .stat-pill {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px var(--shadow);
  }
  .stat-pill .track { width: 70px; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
  .stat-pill .fill { height: 100%; background: var(--green); }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .sidebar {
    display: flex; flex-direction: column; gap: 2px; position: sticky; top: 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px;
    box-shadow: 0 2px 10px var(--shadow);
  }
  @media (max-width: 800px) { .sidebar { position: static; } }

  .cat-root-row, .cat-row {
    display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
  }
  .cat-root-row:hover, .cat-row:hover { background: var(--surface-2); }
  .cat-root-row.active, .cat-row.active { background: var(--accent-soft); }
  .cat-root-row .name, .cat-row .name { font-size: 0.86rem; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row .name { font-weight: 500; }
  .cat-root-row .count, .cat-row .count { font-size: 0.7rem; font-family: var(--font-mono); color: var(--ink-faint); white-space: nowrap; }
  .cat-actions { display: none; gap: 2px; flex: none; }
  .cat-row:hover .cat-actions, .cat-root-row:hover .cat-actions { display: flex; }
  button.icon-btn {
    border: none; background: transparent; color: var(--ink-faint); cursor: pointer;
    font-size: 0.72rem; padding: 3px 5px; border-radius: 5px; line-height: 1;
  }
  button.icon-btn:hover { background: var(--surface); color: var(--ink); }
  button.icon-btn:disabled { opacity: 0.25; cursor: default; }
  button.icon-btn:disabled:hover { background: transparent; }
  .cat-bar { height: 3px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 1px 8px 4px; }
  .cat-bar i { display: block; height: 100%; background: var(--green); }
  .cat-rename-input {
    flex: 1; font-size: 0.85rem; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--surface); color: var(--ink); min-width: 0;
  }
  .add-cat-row { display: flex; gap: 6px; padding: 5px 8px 8px; align-items: center; }
  .add-cat-row input {
    flex: 1; font-size: 0.82rem; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink); min-width: 0;
  }
  .sidebar-footer { margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .sidebar-hint { font-size: 0.74rem; color: var(--ink-faint); padding: 6px 8px; line-height: 1.6; }
  .btn.sm { padding: 5px 10px; font-size: 0.78rem; border-radius: 7px; }

  .stage { min-width: 0; }

  .board-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; align-items: center; }
  .board-tab {
    display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); cursor: pointer; font-size: 0.84rem;
    color: var(--ink-soft); box-shadow: 0 1px 2px var(--shadow);
  }
  .board-tab:hover { background: var(--surface-2); }
  .board-tab.active { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .board-tab-name { white-space: nowrap; }
  .board-tab-actions { display: none; gap: 2px; }
  .board-tab:hover .board-tab-actions { display: flex; }
  .board-tab.active .icon-btn { color: color-mix(in srgb, var(--surface) 75%, transparent); }
  .board-tab.active .icon-btn:hover { background: color-mix(in srgb, var(--surface) 25%, transparent); color: var(--surface); }
  .board-rename-input {
    font-size: 0.84rem; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--surface); color: var(--ink); width: 110px;
  }
  .board-tab-add {
    background: transparent; border: 1px dashed var(--border); border-radius: 999px; padding: 7px 12px;
    font-size: 0.84rem; color: var(--ink-faint); cursor: pointer;
  }
  .board-tab-add:hover { background: var(--surface-2); color: var(--ink-soft); }
  .add-board-row { display: flex; gap: 6px; align-items: center; }
  .add-board-row input {
    font-size: 0.84rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink);
  }

  .mode-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .mode-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .mode-tabs button { border: none; background: transparent; padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; color: var(--ink-soft); cursor: pointer; }
  .mode-tabs button.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }

  select.filter { font-size: 0.8rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px 24px; box-shadow: 0 2px 10px var(--shadow); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .badge-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sec-label { font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
  .status-badge { font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .status-O { background: var(--green-soft); color: var(--green); }
  .status-△ { background: var(--amber-soft); color: var(--amber); }
  .status-X { background: var(--red-soft); color: var(--red); }
  .status-none { background: var(--surface-2); color: var(--ink-faint); }

  label.field-label { display: block; font-size: 0.76rem; color: var(--ink-faint); margin-bottom: 6px; margin-top: 14px; letter-spacing: 0.02em; }
  label.field-label:first-of-type { margin-top: 0; }

  textarea.recall-input {
    width: 100%; min-height: 150px; resize: vertical; font-family: var(--font-sans); font-size: 0.95rem; line-height: 24px; color: var(--accent);
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: repeating-linear-gradient(0deg, transparent, transparent 23px, var(--paper-line-strong) 23px, var(--paper-line-strong) 24px), var(--surface-2);
    outline: none;
  }
  textarea.recall-input:focus { border-color: var(--accent); }

  input.text-input, select.select-input, .answer-input {
    width: 100%; font-size: 0.9rem; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink); outline: none;
  }
  .answer-input { min-height: 110px; line-height: 1.7; font-family: var(--font-serif); }
  input.text-input:focus, select.select-input:focus, .answer-input:focus { border-color: var(--accent); }
  .answer-editable { position: relative; white-space: pre-wrap; overflow-y: auto; max-height: 340px; }
  .answer-editable div { min-height: 1.7em; }
  .answer-editable.is-empty::before {
    content: attr(data-placeholder); position: absolute; top: 9px; left: 12px;
    color: var(--ink-faint); pointer-events: none;
  }
  .answer-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .answer-toolbar-hint { font-size: 0.72rem; color: var(--ink-faint); }

  .history-section { margin-top: 14px; }
  .history-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .history-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; }
  .history-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .history-date { font-size: 0.72rem; color: var(--ink-faint); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .history-text { font-size: 0.87rem; line-height: 1.6; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
  .history-image { display: block; max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 6px; }

  .pending-image { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .pending-image img { max-width: 220px; max-height: 220px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 1px 3px var(--shadow); }

  .actions-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button.btn { border-radius: 9px; border: 1px solid var(--border); background: var(--surface); padding: 9px 16px; font-size: 0.85rem; cursor: pointer; color: var(--ink); }
  button.btn:hover { background: var(--surface-2); }
  button.btn:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  button.btn.primary:hover { filter: brightness(1.08); }
  button.btn.ghost { background: transparent; }
  button.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  button.btn.danger:hover { background: var(--red-soft); }
  button.btn:disabled { opacity: 0.45; cursor: default; }

  .reveal { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .reveal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .reveal-head .tag { font-size: 0.74rem; color: var(--red); font-weight: 700; letter-spacing: 0.03em; }
  .pencil-btn { background: none; border: none; cursor: pointer; color: var(--ink-faint); font-size: 0.78rem; text-decoration: underline; padding: 2px; }
  .answer-text { font-family: var(--font-serif); font-size: 1rem; line-height: 1.85; color: var(--red); border-left: 3px solid var(--red); padding-left: 14px; }
  .answer-text p { margin: 0 0 10px; }
  .answer-text p:last-child { margin-bottom: 0; }

<script>
const APP_VERSION = "1.11.1";
const STORE_KEY = "diy-flashcards-v1";
const ACTIVE_BOARD_KEY = "diy-flashcards-activeboard-v1";
const SCOPE_KEY = "diy-flashcards-studyscope-v1";

function uid(prefix){ return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8); }
function makeBoard(name){ return { id: uid("board"), name, categories: [], cards: [] }; }

// ---------- boards (과목별 여러 보드) ----------
// Shared by local load AND cloud sync (replaceState) so both paths migrate the
// same pre-multi-board {categories, cards} shape the same way — a mismatch here
// previously caused cloud data to be misread as empty (see CHANGELOG v1.11.1).
function normalizeBoardsInput(parsed){
  if (parsed && Array.isArray(parsed.boards) && parsed.boards.length) {
    return parsed.boards.map(b => ({
      id: b.id || uid("board"),
      name: b.name || "보드",
      categories: b.categories || [],
      cards: b.cards || [],
    }));
  }
  // legacy single-board format: { categories, cards } — migrate into one board
  if (parsed && (parsed.categories || parsed.cards)) {
    return [{ id: uid("board"), name: "내 보드", categories: parsed.categories || [], cards: parsed.cards || [] }];
  }
  return [makeBoard("내 보드")];
}
function loadAllBoards(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [makeBoard("내 보드")];
    return normalizeBoardsInput(JSON.parse(raw));
  } catch(e) { return [makeBoard("내 보드")]; }
}
let allBoards = loadAllBoards();
let activeBoardId = localStorage.getItem(ACTIVE_BOARD_KEY);
if (!activeBoardId || !allBoards.some(b => b.id === activeBoardId)) activeBoardId = allBoards[0].id;
let db = allBoards.find(b => b.id === activeBoardId); // db = the ACTIVE board's {categories, cards}

function saveDB(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ boards: allBoards }));
  } catch(e) {
    alert("저장 공간이 부족합니다. 이미지가 포함된 오래된 답변 기록을 삭제한 뒤 다시 시도해주세요.");
    return;
  }
  if (window.__flashcards && window.__flashcards.onLocalChange) window.__flashcards.onLocalChange({ boards: allBoards });
}

// Hook used by the optional Firebase sync module at the bottom of this file.
window.__flashcards = {
  getState: () => ({ boards: allBoards }),
  replaceState: (newState) => {
    allBoards = normalizeBoardsInput(newState);
    if (!allBoards.some(b => b.id === activeBoardId)) activeBoardId = allBoards[0].id;
    db = allBoards.find(b => b.id === activeBoardId);
    localStorage.setItem(STORE_KEY, JSON.stringify({ boards: allBoards }));
    render();
  },
  onLocalChange: null,
};

function setActiveBoard(boardId){
  const board = allBoards.find(b => b.id === boardId);
  if (!board) return;
  activeBoardId = boardId;
  localStorage.setItem(ACTIVE_BOARD_KEY, activeBoardId);
  db = board;
  selectedCatId = null;
  studyIndex = 0;
  revealShown = {};
  editingAnswerId = null;
  editingCatId = null;
  addingSubcatFor = null;
  editingCardId = null;
  showInlineNewCat = false;
  formDraft = { title: "", categoryId: "", answer: "", importance: 3 };
  historyOpen = false;
  pendingImage = null; pendingImageBlob = null; pendingImageCardId = null;
  shuffleOrder = null;
  studyScope = { all: true, catIds: new Set(), includeUncategorized: true, shuffle: false, importance: new Set([1,2,3,4,5]) };
  saveStudyScope();
  currentTab = "study";
  render();
}
function addBoard(name){
  const board = makeBoard((name || "").trim() || "새 보드");
  allBoards.push(board);
  saveDB();
  setActiveBoard(board.id);
}
function renameBoard(boardId, name){
  const board = allBoards.find(b => b.id === boardId);
  if (!board || !(name || "").trim()) { render(); return; }
  board.name = name.trim();
  saveDB();
  render();
}
function deleteBoard(boardId){
  if (allBoards.length <= 1) { alert("마지막 남은 보드는 삭제할 수 없습니다."); return; }
  if (!confirm("이 보드와 그 안의 모든 카테고리·카드가 삭제됩니다. 계속할까요?")) return;
  allBoards = allBoards.filter(b => b.id !== boardId);
  saveDB();
  if (activeBoardId === boardId) setActiveBoard(allBoards[0].id);
  else render();
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,"&quot;");
}
function applyBold(escapedText){
  return escapedText.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function renderAnswerHtml(text){
  const lines = String(text || "").split("\n").filter(l => l.trim().length);
  if (!lines.length) return `<p style="color:var(--ink-faint)">(모범답안이 비어 있습니다)</p>`;
  return lines.map(line => `<p>${applyBold(escapeHtml(line))}</p>`).join("");
}
function statusText(s){ return s === "O" ? "완벽" : s === "△" ? "애매" : s === "X" ? "다시" : "미채점"; }
function formatDateTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (!blob) { reject(new Error("이미지 변환에 실패했습니다.")); return; }
          resolve({ blob, dataUrl: canvas.toDataURL("image/jpeg", quality) });
        }, "image/jpeg", quality);
      };
      img.onerror = () => reject(new Error("이미지를 불러올 수 없습니다."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("파일을 읽을 수 없습니다."));
    reader.readAsDataURL(file);
  });
}
// ---------- WYSIWYG bold editing (contenteditable) ----------
// Stored answers stay plain text with a **bold** markdown-style convention.
// The edit UI is a contenteditable div that shows real bold live; we convert
// between the stored markdown string and the editable HTML on entry/exit.
function markdownToEditableHtml(text){
  const lines = String(text || "").split("\n");
  return lines.map(line => {
    const esc = applyBold(escapeHtml(line));
    return `<div>${esc || "<br>"}</div>`;
  }).join("");
}
function nodeToMarkdown(node, bold){
  if (node.nodeType === Node.TEXT_NODE) return node.textContent;
  if (node.nodeType !== Node.ELEMENT_NODE) return "";
  const tag = node.tagName;
  if (tag === "BR") return "\n";
  if (tag === "STRONG" || tag === "B") {
    const inner = Array.from(node.childNodes).map(c => nodeToMarkdown(c, true)).join("");
    return inner ? "**" + inner + "**" : "";
  }
  if (tag === "DIV" || tag === "P") {
    const inner = Array.from(node.childNodes).map(c => nodeToMarkdown(c, bold)).join("");
    return inner + "\n";
  }
  return Array.from(node.childNodes).map(c => nodeToMarkdown(c, bold)).join("");
}
function editableHtmlToMarkdown(root){
  let out = Array.from(root.childNodes).map(c => nodeToMarkdown(c, false)).join("");
  if (out.endsWith("\n")) out = out.slice(0, -1);
  return out;
}
function toggleBoldSelection(el){
  el.focus();
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  if (sel.isCollapsed) {
    document.execCommand("bold");
    document.execCommand("insertText", false, "볼드체");
    const sel2 = window.getSelection();
    if (sel2 && sel2.rangeCount) {
      const range = sel2.getRangeAt(0);
      const endNode = range.endContainer, endOffset = range.endOffset;
      const startOffset = Math.max(0, endOffset - 3);
      const newRange = document.createRange();
      newRange.setStart(endNode, startOffset);
      newRange.setEnd(endNode, endOffset);
      sel2.removeAllRanges();
      sel2.addRange(newRange);
    }
  } else {
    document.execCommand("bold");
  }
  el.dispatchEvent(new Event("input", { bubbles: true }));
}
function bindBoldShortcut(el){
  el.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "b" || e.key === "B")) {
      e.preventDefault();
      toggleBoldSelection(el);
    }
  });
}
function bindPlainTextPaste(el){
  el.addEventListener("paste", (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
  });
}
function updateEmptyState(el){
  el.classList.toggle("is-empty", el.textContent.trim() === "");
}

// ---------- category helpers ----------
function categorySortKey(cat){ return cat.order != null ? cat.order : (cat.createdAt || 0); }
function children(parentId){
  return db.categories.filter(c => c.parentId === parentId).sort((a,b) => categorySortKey(a) - categorySortKey(b));
}
function categoryById(id){ return db.categories.find(c => c.id === id); }
function descendantIds(catId){
  const out = [catId];
  children(catId).forEach(c => out.push(...descendantIds(c.id)));
  return out;
}
function categoryPath(id){
  const path = [];
  let cur = categoryById(id);
  while (cur) { path.unshift(cur.name); cur = cur.parentId ? categoryById(cur.parentId) : null; }
  return path;
}
function allCategoriesFlatOrdered(){
  const out = [];
  (function walk(parentId, depth){
    children(parentId).forEach(c => { out.push({id:c.id, name:c.name, depth}); walk(c.id, depth+1); });
  })(null, 0);
  return out;
}
function cardsIn(catId){
  if (catId === null) return db.cards;
  const ids = new Set(descendantIds(catId));
  return db.cards.filter(c => ids.has(c.categoryId));
}
function cardSortKey(card){ return card.order != null ? card.order : (card.createdAt || 0); }
function cardImportance(card){ return card.importance != null ? card.importance : 3; }
function starsHtml(n){ return "★".repeat(n) + "☆".repeat(5 - n); }
function cardsInCategorySorted(catId){
  return db.cards.filter(c => c.categoryId === catId).sort((a,b) => cardSortKey(a) - cardSortKey(b));
}
function reorderSiblings(type, orderedIds){
  orderedIds.forEach((id, i) => {
    if (!id) return;
    const item = type === "card" ? db.cards.find(c => c.id === id) : categoryById(id);
    if (item) item.order = i;
  });
  saveDB();
}
function statusCounts(arr){
  const r = { total: arr.length, unrated: 0, X: 0, "△": 0, O: 0 };
  arr.forEach(c => { if (!c.status) r.unrated++; else r[c.status]++; });
  return r;
}
function matchesFilter(card, filter){
  if (filter === "all") return true;
  if (filter === "unrated") return !card.status;
  return card.status === filter;
}
function buildCategoryOptionsHtml(selectedId){
  let html = `<option value="" ${!selectedId ? "selected" : ""}>미분류</option>`;
  allCategoriesFlatOrdered().forEach(o => {
    const indent = "　".repeat(o.depth) + (o.depth > 0 ? "└ " : "");
    html += `<option value="${o.id}" ${selectedId===o.id ? "selected" : ""}>${indent}${escapeHtml(o.name)}</option>`;
  });
  return html;
}

// ---------- study scope (다중 카테고리 선택 + 셔플 + 중요도) ----------
function loadStudyScope(){
  const fallback = () => ({ all: true, catIds: new Set(), includeUncategorized: true, shuffle: false, importance: new Set([1,2,3,4,5]) });
  try {
    const raw = localStorage.getItem(SCOPE_KEY);
    if (!raw) return fallback();
    const p = JSON.parse(raw);
    return {
      all: p.all !== false,
      catIds: new Set(p.catIds || []),
      includeUncategorized: p.includeUncategorized !== false,
      shuffle: !!p.shuffle,
      importance: new Set(Array.isArray(p.importance) && p.importance.length ? p.importance : [1,2,3,4,5]),
    };
  } catch(e) { return fallback(); }
}
function saveStudyScope(){
  localStorage.setItem(SCOPE_KEY, JSON.stringify({
    all: studyScope.all,
    catIds: Array.from(studyScope.catIds),
    includeUncategorized: studyScope.includeUncategorized,
    shuffle: studyScope.shuffle,
    importance: Array.from(studyScope.importance),
  }));
}
let studyScope = loadStudyScope();
let shuffleOrder = null;   // runtime only: fixed random order while shuffle is on
let scopePanelOpen = false;
let historyOpen = false;
let pendingImage = null;       // runtime only: data URL of an image attached but not yet submitted (local preview)
let pendingImageBlob = null;   // runtime only: the same image as a Blob, used for Firebase Storage upload
let pendingImageCardId = null; // which card pendingImage belongs to; mismatch means it's stale

function materializeScopeIfAll(){
  if (studyScope.all) {
    studyScope.all = false;
    studyScope.catIds = new Set(db.categories.map(c => c.id));
    studyScope.includeUncategorized = true;
  }
}
function focusStudyScopeOnCategory(catId){
  // used by sidebar / dashboard / mindmap clicks to focus study on a single category
  studyScope.all = (catId === null);
  if (catId !== null) { studyScope.catIds = new Set([catId]); studyScope.includeUncategorized = false; }
  else { studyScope.catIds = new Set(); studyScope.includeUncategorized = true; }
  shuffleOrder = null;
  saveStudyScope();
}
function resolvedStudyCategoryIds(){
  if (studyScope.all) return db.categories.map(c => c.id);
  return Array.from(studyScope.catIds).filter(id => categoryById(id));
}
function studyBaseCardIds(){
  const selected = new Set();
  resolvedStudyCategoryIds().forEach(id => descendantIds(id).forEach(d => selected.add(d)));
  const ids = [];
  allCategoriesFlatOrdered().forEach(o => {
    if (selected.has(o.id)) {
      cardsInCategorySorted(o.id).forEach(c => ids.push(c.id));
    }
  });
  if (studyScope.all || studyScope.includeUncategorized) {
    cardsInCategorySorted(null).forEach(c => ids.push(c.id));
  }
  return ids;
}
function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function currentStudyQueue(){
  const baseIds = studyBaseCardIds();
  const baseSet = new Set(baseIds);
  let orderedIds;
  if (studyScope.shuffle) {
    if (!shuffleOrder) shuffleOrder = shuffleArray(baseIds);
    orderedIds = shuffleOrder.filter(id => baseSet.has(id));
    baseIds.forEach(id => { if (!orderedIds.includes(id)) orderedIds.push(id); });
    shuffleOrder = orderedIds;
  } else {
    orderedIds = baseIds;
    shuffleOrder = null;
  }
  const idToCard = new Map(db.cards.map(c => [c.id, c]));
  return orderedIds.map(id => idToCard.get(id)).filter(Boolean)
    .filter(c => matchesFilter(c, currentFilter))
    .filter(c => studyScope.importance.has(cardImportance(c)));
}
function scopeSummaryText(){
  const count = studyBaseCardIds().length;
  let label;
  if (studyScope.all) {
    label = "전체";
  } else {
    const names = resolvedStudyCategoryIds().map(id => categoryById(id)?.name).filter(Boolean);
    if (studyScope.includeUncategorized) names.push("미분류");
    label = names.length ? names.join(", ") : "(선택 없음)";
  }
  const impLabel = studyScope.importance.size === 5 ? "" : ` · ★${Array.from(studyScope.importance).sort().join(",")}`;
  return `${escapeHtml(label)} · ${count}장 · ${studyScope.shuffle ? "🔀 랜덤 순서" : "순서대로"}${impLabel}`;
}

// ---------- sidebar ----------
function catRowsHtml(parentId, depth){
  return children(parentId).map(cat => {
    const ids = new Set(descendantIds(cat.id));
    const catCards = db.cards.filter(c => ids.has(c.categoryId));
    const counts = statusCounts(catCards);
    const pct = counts.total ? Math.round(counts.O / counts.total * 100) : 0;
    const isActive = selectedCatId === cat.id;
    const isEditing = editingCatId === cat.id;
    const showAddForm = addingSubcatFor === cat.id;
    return `
      <div class="cat-item">
        <div class="cat-row${isActive ? " active" : ""}" style="padding-left:${8 + depth*16}px" data-catid="${cat.id}">
          ${isEditing
            ? `<input class="cat-rename-input" id="catRenameInput" value="${escapeAttr(cat.name)}" />`
            : `<span class="name">${escapeHtml(cat.name)}</span>`}
          <span class="count">${counts.total ? `${counts.O}/${counts.total}` : ""}</span>
          <span class="cat-actions">
            ${isEditing
              ? `<button class="icon-btn" data-savecat="${cat.id}" title="저장">✓</button><button class="icon-btn" data-cancelcat="1" title="취소">✕</button>`
              : `<button class="icon-btn" data-addsub="${cat.id}" title="하위 카테고리 추가">+</button><button class="icon-btn" data-editcat="${cat.id}" title="이름 수정">✎</button><button class="icon-btn" data-delcat="${cat.id}" title="삭제">🗑</button>`}
          </span>
        </div>
        ${counts.total ? `<div class="cat-bar" style="margin-left:${8 + depth*16}px"><i style="width:${pct}%"></i></div>` : ""}
        ${showAddForm ? `
          <div class="add-cat-row" style="padding-left:${8 + (depth+1)*16}px">
            <input type="text" id="newSubcatInput" placeholder="새 카테고리 이름" />
            <button class="btn primary sm" data-confirmadd="${cat.id}">추가</button>
            <button class="btn ghost sm" data-canceladd="1">취소</button>
          </div>` : ""}
        ${catRowsHtml(cat.id, depth+1)}
      </div>
    `;
  }).join("");
}

  nav.querySelectorAll("[data-confirmadd]").forEach(b => b.onclick = (e) => {

    saveDB();
    addingSubcatFor = null;

  nav.querySelectorAll("[data-editcat]").forEach(b => b.onclick = (e) => {

  });
  nav.querySelectorAll("[data-delcat]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const id = b.dataset.delcat;
    const hasChildren = children(id).length > 0;
    const hasCards = db.cards.some(c => c.categoryId === id);
    if (hasChildren || hasCards) { alert("하위 카테고리나 카드가 있어 삭제할 수 없습니다. 먼저 비워주세요."); return; }
    if (!confirm("이 카테고리를 삭제할까요?")) return;
    db.categories = db.categories.filter(c => c.id !== id);
    if (selectedCatId === id) selectedCatId = null;
    saveDB(); render();
  });
}

function wireScopePanel(view){
  document.getElementById("scopeToggleBtn").onclick = () => { scopePanelOpen = !scopePanelOpen; renderStudy(); };
  const allBtn = document.getElementById("scopeAllBtn");
  if (allBtn) allBtn.onclick = () => {
    studyScope.all = true; studyScope.catIds = new Set(); studyScope.includeUncategorized = true;
    if (studyScope.shuffle) shuffleOrder = shuffleArray(studyBaseCardIds());
    saveStudyScope(); studyIndex = 0; renderStudy();
  };
  const noneBtn = document.getElementById("scopeNoneBtn");
  if (noneBtn) noneBtn.onclick = () => {
    studyScope.all = false; studyScope.catIds = new Set(); studyScope.includeUncategorized = false;
    shuffleOrder = null;
    saveStudyScope(); studyIndex = 0; renderStudy();
  };
  const shuffleCheck = document.getElementById("scopeShuffleCheck");
  if (shuffleCheck) shuffleCheck.onchange = () => {
    studyScope.shuffle = shuffleCheck.checked;
    shuffleOrder = studyScope.shuffle ? shuffleArray(studyBaseCardIds()) : null;
    saveStudyScope(); studyIndex = 0; renderStudy();
  };
  const reshuffleBtn = document.getElementById("scopeReshuffleBtn");
  if (reshuffleBtn) reshuffleBtn.onclick = () => {
    shuffleOrder = shuffleArray(studyBaseCardIds());
    studyIndex = 0; renderStudy();
  };
  const uncatCheck = document.getElementById("scopeUncatCheck");
  if (uncatCheck) uncatCheck.onchange = () => {
    materializeScopeIfAll();
    studyScope.includeUncategorized = uncatCheck.checked;
    if (studyScope.shuffle) shuffleOrder = shuffleArray(studyBaseCardIds());
    saveStudyScope(); studyIndex = 0; renderStudy();
  };
  view.querySelectorAll(".scope-cat-check").forEach(chk => {
    chk.onchange = () => {
      materializeScopeIfAll();
      if (chk.checked) studyScope.catIds.add(chk.dataset.catid);
      else studyScope.catIds.delete(chk.dataset.catid);
      if (studyScope.shuffle) shuffleOrder = shuffleArray(studyBaseCardIds());
      saveStudyScope(); studyIndex = 0; renderStudy();
    };
  });
  view.querySelectorAll("[data-imptoggle]").forEach(btn => {
    btn.onclick = () => {
      const n = Number(btn.dataset.imptoggle);
      if (studyScope.importance.has(n)) {
        if (studyScope.importance.size > 1) studyScope.importance.delete(n);
      } else {
        studyScope.importance.add(n);
      }
      saveStudyScope(); studyIndex = 0; renderStudy();
    };
  });
}

    attachBtn.disabled = true;
    attachBtn.textContent = "처리 중…";
    try {
      const resized = await resizeImageFile(file, 1200, 0.75);
      pendingImage = resized.dataUrl;
      pendingImageBlob = resized.blob;
      pendingImageCardId = card.id;
    } catch(err) {
      alert("이미지를 처리하지 못했습니다: " + err.message);
    }
    renderStudy();
  };
  const pendingRemoveBtn = document.getElementById("pendingImageRemoveBtn");
  if (pendingRemoveBtn) pendingRemoveBtn.onclick = () => {

  };

    const submitBtn = document.getElementById("studySubmitBtn");

// ---------- mindmap (outline) view ----------
function cardKidsFor(catId){
  return cardsInCategorySorted(catId).map(c => ({ type: "card", id: c.id, name: c.title, status: c.status, importance: cardImportance(c), children: [] }));
}
function buildMindmapTree(){
  function catNode(cat){
    const kids = children(cat.id).map(catNode);
    const cardKids = cardKidsFor(cat.id);
    return { type: "category", id: cat.id, name: cat.name, children: [...kids, ...cardKids] };
  }
  const topCats = children(null).map(catNode);
  const uncatCards = cardKidsFor(null);
  const rootChildren = [...topCats];
  if (uncatCards.length) rootChildren.push({ type: "category", id: null, name: "미분류", children: uncatCards });
  return { type: "root", id: null, name: "전체", children: rootChildren };
}
function countCardsInNode(node){
  if (node.type === "card") return 1;
  return node.children.reduce((sum, ch) => sum + countCardsInNode(ch), 0);
}
function mmOutlineHtml(node){
  if (node.type === "root") {
    return node.children.map(mmOutlineHtml).join("");
  }
  if (node.type === "category") {
    const dragId = node.id === null ? "" : node.id;
    const handle = node.id !== null
      ? `<span class="mm-drag-handle" title="드래그해서 순서 변경">⠿</span>`
      : `<span class="mm-drag-spacer"></span>`;
    return `
      <div class="mm-branch" data-dragid="${dragId}">
        <div class="mm-cat-row" data-catid="${dragId}">
          ${handle}
          <span class="mm-cat-name">${escapeHtml(node.name)}</span>
          <span class="mm-cat-count">${countCardsInNode(node)}장</span>
        </div>
        <div class="mm-children">${node.children.map(mmOutlineHtml).join("")}</div>
      </div>
    `;
  }
  const stCls = node.status ? `st-${node.status}` : "st-none";
  return `
    <div class="mm-card-row ${stCls}" data-cardid="${node.id}" data-dragid="${node.id}">
      <span class="mm-drag-handle" title="드래그해서 순서 변경">⠿</span>
      <span class="mm-card-dot ${stCls}"></span>
      <span class="mm-card-title">${escapeHtml(node.name)}</span>
      <span class="mm-card-stars">${starsHtml(node.importance)}</span>
    </div>
  `;
}
function startSortableDrag(e, item, siblingSelector, onDrop){
  e.preventDefault();
  e.stopPropagation();
  const parent = item.parentElement;
  const pointerId = e.pointerId;
  const getSiblings = () => Array.from(parent.children).filter(el => el.matches(siblingSelector));
  item.classList.add("mm-dragging");
  try { item.setPointerCapture(pointerId); } catch(err) {}

  function onMove(ev){
    const y = ev.clientY;
    const siblings = getSiblings();
    for (const sib of siblings) {
      if (sib === item) continue;
      const rect = sib.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      const itemIsAfter = !!(sib.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_FOLLOWING);
      if (y < mid && itemIsAfter) { parent.insertBefore(item, sib); break; }
      if (y > mid && !itemIsAfter) { parent.insertBefore(item, sib.nextSibling); break; }
    }
  }
  function onUp(){
    item.removeEventListener("pointermove", onMove);
    item.removeEventListener("pointerup", onUp);
    item.removeEventListener("pointercancel", onUp);
    item.classList.remove("mm-dragging");
    try { item.releasePointerCapture(pointerId); } catch(err) {}
    const orderedIds = getSiblings().map(el => el.dataset.dragid);
    onDrop(orderedIds);
  }
  item.addEventListener("pointermove", onMove);
  item.addEventListener("pointerup", onUp);
  item.addEventListener("pointercancel", onUp);
}
function renderMindmap(){
  const view = document.getElementById("mindmapView");
  if (!db.categories.length && !db.cards.length) {
    view.innerHTML = `<div class="card empty-state"><div class="big">🧠</div>카테고리와 카드를 만들면 이곳에 마인드맵이 표시됩니다.</div>`;
    return;
  }
  const root = buildMindmapTree();

  view.innerHTML = `
    <div class="mindmap-toolbar">
      <div class="dash-summary" style="margin-bottom:0;">
        <span class="dash-chip"><i class="dot-O"></i>완벽 ${counts.O}</span>
        <span class="dash-chip"><i class="dot-△"></i>애매 ${counts["△"]}</span>
        <span class="dash-chip"><i class="dot-X"></i>다시 ${counts.X}</span>

      <div class="mm-outline">${mmOutlineHtml(root)}</div>
    </div>
  `;

  view.querySelectorAll(".mm-cat-row").forEach(row => {
    row.onclick = (e) => {

      selectedCatId = row.dataset.catid || null;

    const handle = row.querySelector(".mm-drag-handle");

        reorderSiblings("category", orderedIds);
        renderMindmap();
      });
    });
  });
  view.querySelectorAll(".mm-card-row").forEach(row => {
    row.onclick = (e) => {
      if (e.target.closest(".mm-drag-handle")) return;
      const cardId = row.dataset.cardid;

      selectedCatId = catId;
      focusStudyScopeOnCategory(catId);
      currentFilter = "all";
      const list = currentStudyQueue();
      const idx = list.findIndex(c => c.id === cardId);
      studyIndex = idx >= 0 ? idx : 0;
      revealShown[cardId] = true;
      currentTab = "study";
      render();
    };
    const handle = row.querySelector(".mm-drag-handle");
    if (handle) handle.addEventListener("pointerdown", (e) => {
      startSortableDrag(e, row, ".mm-card-row", (orderedIds) => {
        reorderSiblings("card", orderedIds);
        renderMindmap();
      });
    });
  });

  document.getElementById("mmPdfBtn").onclick = () => { window.print(); };
}

  const container = document.getElementById("boardTabs");
  const tabsHtml = allBoards.map(b => {
    const active = b.id === activeBoardId;
    const editing = editingBoardId === b.id;
    return `
      <div class="board-tab${active ? " active" : ""}" data-boardid="${b.id}">
        ${editing
          ? `<input class="board-rename-input" id="boardRenameInput" value="${escapeAttr(b.name)}" />`
          : `<span class="board-tab-name">${escapeHtml(b.name)}</span>`}
        <span class="board-tab-actions">
          ${editing
            ? `<button class="icon-btn" data-saveboard="${b.id}" title="저장">✓</button><button class="icon-btn" data-cancelboard="1" title="취소">✕</button>`
            : `<button class="icon-btn" data-editboard="${b.id}" title="이름 수정">✎</button>${allBoards.length > 1 ? `<button class="icon-btn" data-delboard="${b.id}" title="삭제">🗑</button>` : ""}`}
        </span>
      </div>
    `;
  }).join("");
  const addHtml = addingBoardOpen ? `
    <div class="add-board-row">
      <input type="text" id="newBoardInput" placeholder="새 보드 이름 (예: 생물, 화학...)" />
      <button class="btn primary sm" id="confirmAddBoardBtn">추가</button>
      <button class="btn ghost sm" id="cancelAddBoardBtn">취소</button>
    </div>` : `<button class="board-tab board-tab-add" id="addBoardBtn">+ 새 보드</button>`;

  container.innerHTML = tabsHtml + addHtml;

  container.querySelectorAll(".board-tab[data-boardid]").forEach(tab => {
    tab.addEventListener("click", (e) => {
      if (e.target.closest(".board-tab-actions") || e.target.tagName === "INPUT") return;
      setActiveBoard(tab.dataset.boardid);
    });
  });
  container.querySelectorAll("[data-editboard]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); editingBoardId = b.dataset.editboard; render();
    const inp = document.getElementById("boardRenameInput"); if (inp) { inp.focus(); inp.select(); }
  });
  container.querySelectorAll("[data-cancelboard]").forEach(b => b.onclick = (e) => { e.stopPropagation(); editingBoardId = null; render(); });
  container.querySelectorAll("[data-saveboard]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const inp = document.getElementById("boardRenameInput");
    const name = inp.value;
    editingBoardId = null;
    renameBoard(b.dataset.saveboard, name);
  });
  container.querySelectorAll("[data-delboard]").forEach(b => b.onclick = (e) => { e.stopPropagation(); deleteBoard(b.dataset.delboard); });

  const addBtn = document.getElementById("addBoardBtn");
  if (addBtn) addBtn.onclick = () => {
    addingBoardOpen = true; render();
    const inp = document.getElementById("newBoardInput"); if (inp) inp.focus();
  };
  const confirmBtn = document.getElementById("confirmAddBoardBtn");
  if (confirmBtn) confirmBtn.onclick = () => {
    const inp = document.getElementById("newBoardInput");
    const name = (inp.value || "").trim();
    if (!name) return;
    addingBoardOpen = false;
    addBoard(name);
  };
  const cancelBtn = document.getElementById("cancelAddBoardBtn");
  if (cancelBtn) cancelBtn.onclick = () => { addingBoardOpen = false; render(); };
}

// ---------- orchestration ----------
function renderStatPill(){
  const counts = statusCounts(db.cards);
  document.getElementById("overallStat").textContent = `${counts.O} / ${counts.total} 완벽`;
  document.getElementById("overallFill").style.width = (counts.total ? counts.O / counts.total * 100 : 0) + "%";
}

function render(){
  renderBoardTabs();
  renderSidebar();
  document.getElementById("filterSelect").value = currentFilter;
  document.getElementById("filterSelect").style.display = (currentTab === "study" || currentTab === "manage") ? "" : "none";
  document.getElementById("tabStudy").classList.toggle("active", currentTab === "study");
  document.getElementById("tabManage").classList.toggle("active", currentTab === "manage");
  document.getElementById("tabDash").classList.toggle("active", currentTab === "dash");
  document.getElementById("tabMindmap").classList.toggle("active", currentTab === "mindmap");
  document.getElementById("studyView").style.display = currentTab === "study" ? "" : "none";
  document.getElementById("manageView").style.display = currentTab === "manage" ? "" : "none";
  document.getElementById("dashView").style.display = currentTab === "dash" ? "" : "none";
  document.getElementById("mindmapView").style.display = currentTab === "mindmap" ? "" : "none";
  if (currentTab === "study") renderStudy();
  else if (currentTab === "manage") renderManage();
  else if (currentTab === "dash") renderDash();
  else renderMindmap();
  renderStatPill();
}

document.getElementById("tabStudy").onclick = () => { currentTab = "study"; render(); };
document.getElementById("tabManage").onclick = () => {
  currentTab = "manage";
  if (!editingCardId) formDraft = { title: "", categoryId: selectedCatId || "", answer: "", importance: 3 };
  render();
};
document.getElementById("tabDash").onclick = () => { currentTab = "dash"; render(); };
document.getElementById("tabMindmap").onclick = () => { currentTab = "mindmap"; render(); };
document.getElementById("filterSelect").onchange = (e) => { currentFilter = e.target.value; studyIndex = 0; render(); };

document.getElementById("versionTag").textContent = "v" + APP_VERSION;
render();
</script>

<!--
  ============================================================================
  클라우드 동기화(Firebase) 설정 안내
  ============================================================================
  1. https://console.firebase.google.com 에서 새 프로젝트를 만드세요. (예: "flashcards-xxxx")
  2. 왼쪽 메뉴 Build > Authentication > Sign-in method 에서 "Google"을 사용 설정하세요.
  3. 왼쪽 메뉴 Build > Firestore Database 에서 데이터베이스를 만드세요(프로덕션 모드).
     그 다음 "규칙" 탭에서 아래 규칙으로 바꾸고 게시하세요 (본인 데이터만 읽고 쓸 수 있게 제한):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /flashcards/{uid} {
             allow read, write: if request.auth != null && request.auth.uid == uid;
           }
         }
       }

  4. 프로젝트 설정(톱니바퀴) > 일반 > "내 앱"에서 웹 앱을 추가(</> 아이콘)하면
     firebaseConfig 객체가 나옵니다. 그 값을 아래 CONFIG 자리에 그대로 붙여넣으세요.
  5. Authentication > Settings > 승인된 도메인에, 이 파일을 올릴 GitHub Pages 도메인
     (예: your-id.github.io)을 추가하세요. 로컬 file:// 로 열 때는 로그인이 되지 않을 수
     있으니, 실제 로그인 테스트는 GitHub Pages에 올린 뒤 하세요.
  6. 이 파일을 GitHub 저장소에 올리고 Settings > Pages 에서 배포하면,
     그 주소로 어느 기기에서든 접속해 Google로 로그인만 하면 카드와 채점 기록(텍스트)이
     자동으로 동기화됩니다.

  ----------------------------------------------------------------------------
  답변 이미지 저장: Cloudinary (무료, 카드 등록 불필요)
  ----------------------------------------------------------------------------
  Firebase Storage는 이제 유료(Blaze) 요금제가 있어야 켤 수 있어서, 이미지는
  카드 등록이 필요 없는 무료 이미지 호스팅 서비스 Cloudinary를 통해 저장합니다.
  (Firestore 문서에는 이미지 URL만 저장되어 1MB 문서 제한과 무관합니다.)

  1. https://cloudinary.com 에서 무료 계정을 만드세요 (신용카드 필요 없음).
  2. 대시보드 상단에서 "Cloud Name"을 확인하세요.
  3. Settings(톱니바퀴) > Upload > "Upload presets" > "Add upload preset"
     - Signing Mode를 "Unsigned"로 설정
     - 이름을 정하고 저장 (예: "flashcards_unsigned")
  4. 아래 CLOUDINARY CONFIG 자리에 Cloud Name과 방금 만든 preset 이름을 넣으세요.

  주의: Unsigned 업로드는 API 비밀키 없이 브라우저에서 바로 파일을 올리는 방식이라
  무료 개인용 앱에 적합하지만, 이 preset을 아는 사람은 누구나 이 계정으로 이미지를
  올릴 수 있습니다. 이 앱을 본인만 쓴다면 문제 없습니다.
  또한 Unsigned 방식은 삭제 API를 지원하지 않아, 앱에서 답변 기록을 삭제해도
  Cloudinary에 올라간 이미지 파일 자체는 남아있습니다(무료 25GB 안에서는 무해함).

  설정 전(또는 로그인하지 않은 상태)에 이미지를 제출하면, 이미지는 이 기기의
  localStorage에만 (base64로) 저장되고 클라우드에는 동기화되지 않습니다.
  ============================================================================
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ↓↓↓ Firebase 콘솔에서 복사한 값으로 이 객체를 교체하세요 ↓↓↓
  const firebaseConfig = {
    apiKey: "AIzaSyBfZiPL427ZytIjcgTDDZfHxmwYJkJHSBc",
    authDomain: "flashcards-1c668.firebaseapp.com",
    projectId: "flashcards-1c668",
    storageBucket: "flashcards-1c668.firebasestorage.app",
    messagingSenderId: "1007528013052",
    appId: "1:1007528013052:web:6951fa47414a28c2ba3b79",
  };
  // ↑↑↑ 여기까지 ↑↑↑

  // ↓↓↓ Cloudinary 대시보드에서 확인한 값으로 이 객체를 교체하세요 (답변 이미지 저장용, 무료) ↓↓↓
  const cloudinaryConfig = {
    cloudName: "l7rv6jby",
    uploadPreset: "flashcards_unsigned",
  };
  // ↑↑↑ 여기까지 ↑↑↑

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
  const isCloudinaryConfigured = cloudinaryConfig.cloudName && !cloudinaryConfig.cloudName.startsWith("YOUR_");
  const authArea = document.getElementById("authArea");
  const loginGate = document.getElementById("loginGate");
  const appEl = document.querySelector(".app");
  let auth, fsdb;

  function setGate(show){
    loginGate.style.display = show ? "flex" : "none";
    appEl.style.display = show ? "none" : "block";
  }

  function doSignIn(){
    return signInWithPopup(auth, new GoogleAuthProvider()).catch(err => alert("로그인 실패: " + err.message));
  }

  function renderAuthUI(user){
    if (!isConfigured){
      authArea.innerHTML = `<span style="font-size:0.72rem;color:var(--ink-faint)">클라우드 동기화 미설정 (이 기기에만 저장됨)</span>`;
      setGate(false);
      return;
    }
    if (user){
      authArea.innerHTML =
        `<span style="font-size:0.78rem;color:var(--ink-soft)">${user.displayName || user.email}로 동기화 중</span> ` +
        `<button class="btn" style="padding:5px 10px;font-size:0.75rem" id="signOutBtn">로그아웃</button>`;
      document.getElementById("signOutBtn").onclick = () => signOut(auth);
      setGate(false);
    } else {
      authArea.innerHTML = `<button class="btn primary" style="padding:6px 14px;font-size:0.78rem" id="signInBtn">Google로 로그인 (기기 간 동기화)</button>`;
      document.getElementById("signInBtn").onclick = doSignIn;
      setGate(true);
    }
  }

  document.getElementById("gateSignInBtn").onclick = doSignIn;

  if (!isConfigured){
    renderAuthUI(null);
  } else {
    setGate(true);
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    fsdb = getFirestore(app);

    if (isCloudinaryConfigured) {
      window.__flashcards.uploadImage = async (blob) => {
        const form = new FormData();
        form.append("file", blob);
        form.append("upload_preset", cloudinaryConfig.uploadPreset);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/image/upload`, {
          method: "POST",
          body: form,
        });
        if (!res.ok) throw new Error("Cloudinary 업로드 실패 (" + res.status + ")");
        const data = await res.json();
        return { url: data.secure_url, path: data.public_id };
      };
      // Unsigned Cloudinary 업로드는 API 비밀키 없이 동작하는 대신 삭제 API를 지원하지 않음.
      // 답변 기록을 지우면 앱에서는 사라지지만 Cloudinary에 올라간 파일 자체는 남아있음(무료 25GB 안에서는 무해).
      window.__flashcards.deleteImage = async () => {};
    }

    let unsubSnapshot = null;
    let suppressPush = false;
    let pushTimer = null;

    window.__flashcards.onLocalChange = (currentDB) => {
      const user = auth.currentUser;
      if (!user || suppressPush) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        setDoc(doc(fsdb, "flashcards", user.uid), { db: currentDB, updatedAt: Date.now() })
          .catch(err => console.error("동기화 저장 실패", err));
      }, 700);
    };

    onAuthStateChanged(auth, async (user) => {
      renderAuthUI(user);
      if (unsubSnapshot) { unsubSnapshot(); unsubSnapshot = null; }
      if (!user) return;

      const ref = doc(fsdb, "flashcards", user.uid);
      const snap = await getDoc(ref);
      suppressPush = true;
      if (snap.exists()) {
        window.__flashcards.replaceState(snap.data().db || {});
      } else {
        await setDoc(ref, { db: window.__flashcards.getState(), updatedAt: Date.now() });
      }
      suppressPush = false;

      unsubSnapshot = onSnapshot(ref, (snap) => {
        if (!snap.exists()) return;
        suppressPush = true;
        window.__flashcards.replaceState(snap.data().db || {});
        suppressPush = false;
      });
    });
  }
</script>
